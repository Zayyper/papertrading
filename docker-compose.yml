# Coolify: add this repository as a "Docker Compose" resource. Expose the `ui` service (port 8765)
# on your domain and set HL_UI_PASSWORD in the environment. Both services share the data volume:
# the paper trader writes data/paper/paper.db, the page reads it.
services:
  ui:
    build: .
    restart: unless-stopped
    environment:
      HL_UI_PASSWORD: ${HL_UI_PASSWORD:-}      # required on the internet; blank = no password (localhost only)
    ports:
      - "127.0.0.1:8765:8765"   # loopback only: on a server the page is reached through Coolify's HTTPS proxy, never directly
    volumes:
      - hl-data:/app/data
      - hl-out:/app/out

  pump:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "hl_screener", "pump", "collect"]
    environment:
      SOLANA_WS_URL: ${SOLANA_WS_URL:-}               # blank = Solana's public endpoint (free, about 1 slot behind the chain)
      SOLANA_WS_FALLBACK: ${SOLANA_WS_FALLBACK:-}     # e.g. a Helius URL: used only after the main feed fails twice in a row, for 15 min
      PUMP_RETENTION_DAYS: ${PUMP_RETENTION_DAYS:-3}  # about 1.2 GB per day of pump.fun and PumpSwap trades; storing pauses under 1 GB free
    volumes:
      - hl-data:/app/data

  paper:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "hl_screener", "paper", "--leaders", "${HL_PAPER_LEADERS:-paper/leaders.csv}"]
    volumes:
      - hl-data:/app/data
      - hl-out:/app/out

  # the copy test (copytest.toml): the order book after every trade of the tracked wallets, in Postgres.
  # Coolify generates SERVICE_PASSWORD_COPYTEST on the first deploy; the database is only reachable inside this stack.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_USER: hl
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_COPYTEST}
      POSTGRES_DB: hl
    volumes:
      - hl-pg:/var/lib/postgresql/data

  tape:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "hl_screener", "copytest", "collect"]
    depends_on:
      - db
    environment:
      PGHOST: db
      PGUSER: hl
      PGPASSWORD: ${SERVICE_PASSWORD_COPYTEST}
      PGDATABASE: hl
    volumes:
      - hl-data:/app/data

volumes:
  hl-data:
  hl-out:
  hl-pg:
