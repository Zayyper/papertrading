# Coolify: add this repository as a "Docker Compose" resource. Expose the `ui` service (port 8765)
# on your domain and set HL_UI_PASSWORD in the environment. Both services share the data volume:
# the paper trader writes data/paper/paper.db, the page reads it.
services:
  ui:
    build: .
    restart: unless-stopped
    environment:
      HL_UI_PASSWORD: ${HL_UI_PASSWORD:-}      # required on the internet; blank = no password (localhost only)
    ports:
      - "127.0.0.1:8765:8765"   # loopback only: on a server the page is reached through Coolify's HTTPS proxy, never directly
    volumes:
      - hl-data:/app/data
      - hl-out:/app/out

  pump:
    build: .
    restart: unless-stopped
    stop_grace_period: 15s    # SIGTERM closes the feed sockets within seconds; unclosed, the public RPC refuses the next container
    command: ["python", "-m", "hl_screener", "pump", "collect"]
    environment:
      SOLANA_WS_URL: ${SOLANA_WS_URL:-}               # blank = Solana's public endpoint (free, about 1 slot behind the chain)
      SOLANA_WS_FALLBACK: ${SOLANA_WS_FALLBACK:-}     # e.g. a Helius URL: used only after the main feed fails twice in a row, for 15 min
      PUMP_RETENTION_DAYS: ${PUMP_RETENTION_DAYS:-2}  # about 1.2 GB per day of trades; under 3 GB free only 36 h are kept, under 1 GB storing pauses
      PUMP_LIVE: ${PUMP_LIVE:-dry}                    # dry: every copy simulated, nothing sent | live: real trades (needs the next two) | exit: no new copies, the open ones sold | off
      PUMP_LIVE_KEY: ${PUMP_LIVE_KEY:-}               # live and exit: base58 secret key of a wallet used for nothing else; set in Coolify, never in git
      PUMP_LIVE_WALLETS: ${PUMP_LIVE_WALLETS:-}       # whom to copy, comma-separated (dry with none: every golden wallet)
      PUMP_LIVE_STAKE_SOL: ${PUMP_LIVE_STAKE_SOL:-0.25}
      PUMP_LIVE_MAX_OPEN: ${PUMP_LIVE_MAX_OPEN:-3}
      PUMP_LIVE_DAY_LOSS_SOL: ${PUMP_LIVE_DAY_LOSS_SOL:-0.5}
      PUMP_LIVE_RPC: ${PUMP_LIVE_RPC:-}               # an HTTPS RPC for the live copies' reads: simulations, blockhashes, balances, lookups; blank = the public endpoint
      PUMP_GAP_RPC: ${PUMP_GAP_RPC:-}                 # the gap checks' reads (about 2 a second after each feed drop); blank = the public endpoint, never PUMP_LIVE_RPC
      PUMP_LIVE_SEND: ${PUMP_LIVE_SEND:-}             # where signed transactions go, comma-separated; blank = Helius Sender, keyless (1 a second per IP)
      PUMP_LIVE_BUY_SLIP: ${PUMP_LIVE_BUY_SLIP:-}     # blank = 0.25: a buy fails rather than get 25 % fewer tokens than priced
      PUMP_LIVE_SELL_SLIP: ${PUMP_LIVE_SELL_SLIP:-}   # blank = 0.5: sell tries 1-2 take up to 50 % less SOL than priced; the last try takes any price
      PUMP_LIVE_SIM_SIGNER: ${PUMP_LIVE_SIM_SIGNER:-} # dry only: simulate as this funded address; blank = as the copied wallet
      PUMP_LIVE_MAX_AGE_S: ${PUMP_LIVE_MAX_AGE_S:-}   # blank = 2: a buy not ready 2 s after its wallet's is not sent (nor simulated); sells always go out
      PUMP_LIVE_TIP_SOL: ${PUMP_LIVE_TIP_SOL:-}       # blank = 0.00001: Helius Sender's tip (SWQOS-only under 0.001, Sender Max from 0.001); the paper pays it too
      PUMP_LIVE_PRIORITY_SOL: ${PUMP_LIVE_PRIORITY_SOL:-}   # blank = 0.0002: priority fee per transaction; the paper pays it too
      PUMP_LIVE_EXIT: ${PUMP_LIVE_EXIT:-}             # blank = wallet: sold when the copied wallet sells; or a rule of our own: tp100_sl50, hold2m, hold30s...
    volumes:
      - hl-data:/app/data

  paper:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "hl_screener", "paper", "--leaders", "${HL_PAPER_LEADERS:-paper/leaders.csv}"]
    volumes:
      - hl-data:/app/data
      - hl-out:/app/out

  # the copy test (copytest.toml): the order book after every trade of the tracked wallets, in Postgres.
  # Coolify generates SERVICE_PASSWORD_COPYTEST on the first deploy; the database is only reachable inside this stack.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=20"]
    environment:
      POSTGRES_USER: hl
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_COPYTEST}
      POSTGRES_DB: hl
    volumes:
      - hl-pg:/var/lib/postgresql/data

  tape:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "hl_screener", "copytest", "collect"]
    depends_on:
      - db
    environment:
      PGHOST: db
      PGUSER: hl
      PGPASSWORD: ${SERVICE_PASSWORD_COPYTEST}
      PGDATABASE: hl
    volumes:
      - hl-data:/app/data

volumes:
  hl-data:
  hl-out:
  hl-pg:
