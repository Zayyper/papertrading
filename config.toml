# Hyperliquid niche-trader screener — every number is a decision. Change it, note why.

[data]
data_dir = "data"
out_dir = "out"
request_weight_per_minute = 1000   # HL limit is 1200/min/IP
random_seed = 42

[pool]
equity_min_usd = 1000.0
equity_max_usd = 50000.0
min_alltime_volume_usd = 250000.0
pool_max_accounts = 3200            # ~1h of downloads at HL rate limits; use --pool 60 for a first look
pool_selection = "random"          # "random" is clean; "month_roi" is a biased quick look

[windows]
lookback_days = 180
oos_days = 60                      # in-sample = first 120 days, out-of-sample = last 60
min_account_age_days = 90

[copy]
latency_s = 3.0
hold_multiple_of_latency = 60.0    # median hold >= 60 x 3s = 3 min
latency_z = 1.0
impact_coeff = 1.0
taker_fee_bps = 4.5
builder_fee_bps = 0.0              # set e.g. 10.0 to model copying through a platform that takes a cut
follower_equity_usd = 1000.0
follower_max_leverage = 10.0
apply_funding = true

[liquidity]
tier_major_min_vlm = 200000000.0
tier_mid_min_vlm = 10000000.0
max_thin_notional_share = 0.20

[filters]
min_trades = 50
min_active_days = 20
max_days_since_last_trade = 14
max_median_leverage = 25.0
max_top2_share = 0.40
min_profit_factor = 1.3
max_drawdown = 0.30
min_positive_buckets_share = 0.5
max_liquidations = 0
min_follower_roi_is = 0.0

[ranking]
shortlist_size = 15
min_shortlist_leaders = 3
naive_top_n = 5
dd_floor = 0.05
